{% extends "backoffice/base.html" %}
{% load i18n %}
{% block title %}{% trans "Kích hoạt tài khoản" %}{% endblock %}
{% block content %}
<h2 class="mb-3">{% trans "Kích hoạt tài khoản" %}: {{ target.username }}</h2>
<form method="post" class="card card-body">
  {% csrf_token %}
  <p class="text-muted">{% trans "Tài khoản sẽ được kích hoạt lại." %}</p>
  <button class="btn btn-success">{% trans "Kích hoạt" %}</button>
  <a href="{% url 'backoffice:user_list' %}" class="btn btn-secondary">{% trans "Hủy" %}</a>
</form>
{% endblock %}
