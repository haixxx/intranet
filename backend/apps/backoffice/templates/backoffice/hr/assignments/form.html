{% extends "backoffice/base.html" %}
{% block title %}Tạo điều động{% endblock %}
{% block content %}
<h2 class="mb-3">Tạo điều động tạm thời</h2>
<form method="post" class="card card-body">
  {% csrf_token %}
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Nhân sự</label>
      <select name="employee_id" class="form-select form-select-sm" required>
        <option value="">-- Chọn nhân sự --</option>
        {% for e in employees %}
          <option value="{{ e.id }}">{{ e.employee_code }} - {{ e.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Đơn vị nhận</label>
      <select name="to_unit_id" class="form-select form-select-sm" required>
        <option value="">-- Chọn đơn vị --</option>
        {% for u in units %}
          <option value="{{ u.id }}">{{ u.symbol }} - {{ u.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <label class="form-label">Bắt đầu</label>
      <input type="date" name="start_date" class="form-control form-control-sm" required>
    </div>
    <div class="col-md-2">
      <label class="form-label">Kết thúc (optional)</label>
      <input type="date" name="end_date" class="form-control form-control-sm">
    </div>
    <div class="col-md-4">
      <label class="form-label">Lý do</label>
      <select name="reason_code" class="form-select form-select-sm" required>
        <option value="">-- Chọn lý do --</option>
        {% for code,label in reasons %}
          <option value="{{ code }}">{{ code }} - {{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label">Ghi chú</label>
      <textarea name="note" rows="2" class="form-control form-control-sm"></textarea>
    </div>
    <div class="col-md-2">
      <div class="form-check mt-4">
        <input class="form-check-input" type="checkbox" name="apply_flag" id="apply_flag" checked>
        <label class="form-check-label" for="apply_flag">Tính vào hiệu lực</label>
      </div>
    </div>
    <div class="col-12">
      <button class="btn btn-primary btn-sm">Lưu</button>
      <a href="{% url 'backoffice:temp_assignment_list' %}" class="btn btn-secondary btn-sm">Hủy</a>
    </div>
  </div>
</form>
{% endblock %}
