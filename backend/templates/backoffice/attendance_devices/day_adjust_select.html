{% extends "backoffice/base.html" %}
{% block content %}
<h4 class="mb-3">Chọn nhân sự và ngày để điều chỉnh mốc</h4>
<form method="post" class="card card-body">
  {% csrf_token %}
  {% if form.non_field_errors %}
    <div class="alert alert-danger">{{ form.non_field_errors }}</div>
  {% endif %}
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label">Mã nhân sự</label>
      {{ form.employee_code }}
    </div>
    <div class="col-md-3">
      <label class="form-label">Ngày</label>
      {{ form.work_date }}
    </div>
  </div>
  <div class="mt-3 d-flex gap-2">
    <button class="btn btn-primary btn-sm" type="submit">Tiếp tục</button>
    <a class="btn btn-secondary btn-sm" href="{% url 'attendance_devices:backoffice_device_list' %}">Về thiết bị</a>
  </div>
</form>
{% endblock %}
